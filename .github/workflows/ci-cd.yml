name: ci-cd

# Git Flow: feature -> qa (test + baseline metrics) -> main (publish to Docker Hub)
# Note: branch names are case-sensitive; the remote branch is lowercase "qa".
# Docs-only changes do not need a container build (saves Actions minutes).
on:
  pull_request:
    branches: [qa, main]
    paths-ignore: ["**.md", ".claude/**", "images/**", "LICENSE", ".gitignore"]
  push:
    branches: [qa, main]
    paths-ignore: ["**.md", ".claude/**", "images/**", "LICENSE", ".gitignore"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPO: matt13290/tarvos
  LOCAL_TAG: tarvos:ci

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: pip install --no-cache-dir ruff==0.8.4 pyang==2.6.1 pytest==8.3.4 "setuptools<81"

      - name: ruff
        run: ruff check scripts tests daemons

      - name: shellcheck
        run: shellcheck scripts/*.sh tests/integration/*.sh

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile

      - name: pyang
        run: pyang --strict --canonical -p yang yang/*.yang

      - name: Unit tests
        run: pytest -q tests

  build-test:
    name: Build, integration test, metrics
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Report HIGH vulnerabilities (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
          pip install --user --break-system-packages --no-cache-dir ncclient==0.6.15
          tests/integration/smoke.sh "$LOCAL_TAG"
          tests/integration/tacacs.sh "$LOCAL_TAG"

      - name: BGP EVPN lab (two leaves, configured over NETCONF)
        run: |
          # VRF and VXLAN devices live in the host kernel.
          sudo modprobe vrf vxlan || {
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe vrf vxlan
          }
          tests/integration/evpn.sh "$LOCAL_TAG"

      - name: Baseline metrics (informational, no caps)
        if: always()
        run: |
          {
            echo "### Tarvos baseline metrics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            size=$(docker image inspect "$LOCAL_TAG" --format '{{.Size}}' 2>/dev/null || echo 0)
            echo "| Image size | $((size / 1024 / 1024)) MiB |"
            if [ -f metrics.env ]; then
              # shellcheck disable=SC1091
              . ./metrics.env
              echo "| Boot time to NETCONF ready | ${BOOT_SECONDS:-n/a} s |"
              echo "| Container RAM (steady state) | ${MEM_USAGE:-n/a} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-24.04
    needs: [lint, build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Read release version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '${version}'"
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Release tags are immutable: a merge to main must come with a VERSION bump.
      - name: Refuse to overwrite an existing release tag
        run: |
          if docker buildx imagetools inspect "${DOCKERHUB_REPO}:${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${DOCKERHUB_REPO}:${{ steps.version.outputs.tag }} already exists; bump VERSION"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ steps.version.outputs.tag }}
            ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          cache-from: type=gha
